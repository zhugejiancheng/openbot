<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBot - 开源AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem;
            text-align: center;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .container {
            display: flex;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
        }
        
        .sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 1rem;
            margin-right: 1rem;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            color: white;
        }
        
        .message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .user-message {
            background: rgba(76, 175, 80, 0.3);
            margin-left: auto;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }
        
        .bot-message {
            background: rgba(33, 150, 243, 0.3);
            margin-right: auto;
            border: 1px solid rgba(33, 150, 243, 0.5);
        }
        
        .input-area {
            display: flex;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        #messageInput {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
        }
        
        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        #sendButton {
            margin-left: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        #sendButton:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        
        .status-bar {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.8rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .sidebar h3 {
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 0.5rem;
        }
        
        .sidebar-item {
            padding: 0.5rem 0;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        .typing-indicator {
            display: none;
            padding: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 0.5rem;
            }
            
            .sidebar {
                width: 100%;
                margin-right: 0;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 OpenBot - 开源AI助手</h1>
        <p>功能强大的AI助手，支持工具调用和多渠道集成</p>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <h3>功能菜单</h3>
            <div class="sidebar-item" onclick="showTools()">🔧 可用工具</div>
            <div class="sidebar-item" onclick="showHealth()">🏥 系统健康</div>
            <div class="sidebar-item" onclick="showConfig()">⚙️ 系统配置</div>
            <div class="sidebar-item" onclick="clearChat()">🗑️ 清空对话</div>
            <div class="sidebar-item" onclick="showHelp()">❓ 帮助信息</div>
        </div>
        
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message bot-message">
                    <strong>🤖 OpenBot:</strong><br>
                    您好！我是OpenBot，一个开源AI助手。我可以帮助您执行各种任务，包括文件操作、系统命令、网络搜索等。请问有什么可以帮助您的吗？
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">🤖 OpenBot正在思考...</div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入您的消息..." onkeypress="handleKeyPress(event)">
                <button id="sendButton" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>
    
    <div class="status-bar" id="statusBar">
        状态: 就绪 | API连接正常 | 工具可用: 23个
    </div>

    <script>
        let conversationHistory = [];
        
        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 显示用户消息
            addMessage(message, 'user');
            input.value = '';
            
            // 显示打字指示器
            document.getElementById('typingIndicator').style.display = 'block';
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        userId: 'web-user',
                        context: {
                            conversationHistory: conversationHistory.slice(-10) // 最近10条消息
                        }
                    })
                });
                
                const data = await response.json();
                
                // 隐藏打字指示器
                document.getElementById('typingIndicator').style.display = 'none';
                
                if (response.ok) {
                    // 显示机器人回复
                    addMessage(data.response, 'bot');
                    
                    // 更新会话历史
                    conversationHistory.push({role: 'user', content: message});
                    conversationHistory.push({role: 'assistant', content: data.response});
                } else {
                    addMessage(`错误: ${data.error || '请求失败'}`, 'bot');
                }
            } catch (error) {
                document.getElementById('typingIndicator').style.display = 'none';
                addMessage(`错误: ${error.message}`, 'bot');
            }
        }
        
        // 添加消息到聊天区域
        function addMessage(content, sender) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            // 添加粗体标签
            const strongTag = document.createElement('strong');
            strongTag.textContent = sender === 'user' ? '👤 您:' : '🤖 OpenBot:';
            messageDiv.appendChild(strongTag);
            messageDiv.appendChild(document.createElement('br'));
            
            // 处理换行符
            const lines = content.split('\n');
            lines.forEach((line, index) => {
                messageDiv.appendChild(document.createTextNode(line));
                if (index < lines.length - 1) {
                    messageDiv.appendChild(document.createElement('br'));
                }
            });
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 显示可用工具
        async function showTools() {
            try {
                const response = await fetch('/tools');
                const data = await response.json();
                
                let toolsList = '🔧 可用工具列表:\n\n';
                data.availableTools.forEach((tool, index) => {
                    toolsList += `${index + 1}. ${tool.name}: ${tool.description}\n`;
                });
                
                addMessage(toolsList, 'bot');
            } catch (error) {
                addMessage(`获取工具列表失败: ${error.message}`, 'bot');
            }
        }
        
        // 显示系统健康状态
        async function showHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                const healthInfo = `
🏥 系统健康状态:
- 状态: ${data.status}
- 正常运行时间: ${(data.uptime / 60).toFixed(2)} 分钟
- AI配置: ${data.ai_configured ? '已配置' : '未配置'}
- 可用工具: ${data.available_tools} 个
- 可用渠道: ${data.available_channels} 个
                `.trim();
                
                addMessage(healthInfo, 'bot');
            } catch (error) {
                addMessage(`获取健康状态失败: ${error.message}`, 'bot');
            }
        }
        
        // 显示系统配置
        async function showConfig() {
            try {
                const response = await fetch('/config/current');
                const data = await response.json();
                
                if (data.success) {
                    addMessage(`⚙️ 当前系统配置:\n${JSON.stringify(data.content, null, 2)}`, 'bot');
                } else {
                    addMessage('无法获取系统配置信息', 'bot');
                }
            } catch (error) {
                addMessage(`获取配置失败: ${error.message}`, 'bot');
            }
        }
        
        // 清空聊天
        function clearChat() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div class="message bot-message"><strong>🤖 OpenBot:</strong><br>对话历史已清空。有什么可以帮助您的吗？</div>';
            conversationHistory = [];
        }
        
        // 显示帮助信息
        function showHelp() {
            const helpText = `
❓ OpenBot 使用帮助:

基本功能:
- 直接输入问题或指令
- 支持中文自然语言交互
- 可执行文件操作、系统命令、网络搜索等

常用指令:
- /tools - 查看可用工具
- /health - 查看系统健康状态
- /config - 查看系统配置
- /clear - 清空对话历史

特殊功能:
- 支持工具调用 (read, write, exec, web_search等)
- 文件管理和系统操作
- 与多种渠道集成 (飞书、企业微信、钉钉等)
            `.trim();
            
            addMessage(helpText, 'bot');
        }
        
        // 页面加载完成后获取系统信息
        window.onload = function() {
            // 更新状态栏
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('statusBar').textContent = 
                        `状态: ${data.status} | API连接正常 | 工具可用: ${data.available_tools}个 | 渠道: ${data.available_channels}个`;
                })
                .catch(error => {
                    console.error('获取健康状态失败:', error);
                });
        };
    </script>
</body>
</html>
